<link href='https://fonts.googleapis.com/css?family=Open Sans' rel='stylesheet'>
<link href='https://fonts.googleapis.com/css?family=Oswald' rel='stylesheet'>

<style>
    #footer-container {
        display: grid;
        grid-template-columns: 7.5% 50% 15% 7.5% 20%;
        background-color: #EEEEEF;
        gap: 10px;
    }

    #footer-header {
        color: blue;
        font-size: 13pt;
        font-weight: bold;
    }

    #footer-button {
        width: 90%;
        height: 40px;
        background-color: blue;
        border-color: blue;
        color: white;
    }

    #footer-headset-div {
        text-align: center;
    }

    #footer-text-div {
        padding-right: 20px;
    }

    #footer-button-div {
        align-content: center;
        text-align: center;
    }

    #footer-phone-div {
        align-content: center;
        text-align: right;
    }

    #footer-ext-div {
        align-content: center;
        font-weight: bold;
    }
</style>

<html>
    <head>
        <link href="https://fusd-dlee2.github.io/fusdk12-technology-website/css/main.css" rel="stylesheet" type="text/css">
        <title>Technology Website Footer</title>
    </head>
    <body style="margin:0px">
        <div id="footer-container">
            <div id="footer-headset-div"><img src="https://fusd-dlee2.github.io/fusdk12-technology-website/images/footer_headset.png" height="75px" width="75px"></div>
            <div id="footer-text-div">
                <p id="footer-header">Need Technology Support?</p>
                <p>Submit a HelpDesk ticket for all standard technology
                support requests. Call Ext. 12611 only for account/login
                issues, if you cannot access the portal, or if you need
                help being routed to the correct support team.</p>
            </div>
            <div id="footer-button-div"><button id="footer-button">Open HelpDesk Portal</button></div>
            <div id="footer-phone-div"><img src="https://fusd-dlee2.github.io/fusdk12-technology-website/images/footer_phone.png" height="50px" width="50px"></div>
            <div id="footer-ext-div">
                <p>HelpDesk Phone:</p>
                <p>Ext. 12611</p>
            </div>
        </div>
    </body>
</html>
